<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Revadike">
    <title>Armor Set Wishlist</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Module scripts in dependency order -->
    <script src="sync.js"></script>
    <script src="core.js"></script>
    <script src="ui.js"></script>
  </head>

  <body>
    <div class="container">
      <div class="top-controls">
        <div class="global-opts">
          <div class="title-row">
            <h1>Armor Set Wishlist</h1>
            <a href="https://github.com/Revadike/d2armorwishlist" target="_blank" class="github-link" aria-label="View source on GitHub">
              <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
              </svg>
            </a>
          </div>
          <div class="opts-grid">
            <div class="opts-col">
              <select id="classSelect" class="class-select">
                <option value="any">Any Class</option>
                <option value="hunter">Hunter</option>
                <option value="titan">Titan</option>
                <option value="warlock">Warlock</option>
              </select>
              <button id="resetBtn" class="clear-btn">Reset profile</button>
              <button id="importExportBtn" class="clear-btn primary-btn">Import/export</button>
            </div>
            <div class="opts-col">
              <label>
                <input type="checkbox" id="tier5Toggle">
                <strong>Tier 5 only</strong>
              </label>
              <label>
                <input type="checkbox" id="keepToggle">
                <strong>Respect 'keep' tag</strong>
              </label>
              <label>
                <input type="checkbox" id="discardDupeToggle">
                <strong>Discard dupe only</strong>
              </label>
            </div>
          </div>
          <div id="syncStatus" class="sync-status"></div>
        </div>

        <div class="query-outputs">
          <div class="query-box">
            <div class="label-group">
              <label>Wanted / Keep</label>
              <div class="subtext">DIM query</div>
            </div>
            <div class="textarea-container">
              <textarea id="positiveQuery" readonly></textarea>
              <button class="copy-btn" onclick="copyQuery('positiveQuery', this)">Copy</button>
            </div>
          </div>
          <div class="query-box">
            <div class="label-group">
              <label>Junk / Dismantle</label>
              <div class="subtext">DIM query</div>
            </div>
            <div class="textarea-container">
              <textarea id="negativeQuery" readonly></textarea>
              <button class="copy-btn" onclick="copyQuery('negativeQuery', this)">Copy</button>
            </div>
          </div>
        </div>
      </div>

      <div class="table-wrapper">
        <table id="armorTable">
          <thead>
            <tr>
              <th class="col-set sortable" onclick="setSort('Set')">Set ↕</th>
              <th class="col-effect">Bonus</th>
              <th class="col-tier sortable" onclick="setSort('Tier')">Analysis ↕</th>
              <th class="col-want sortable" onclick="setSort('Want')">Want ↕</th>
              <th class="col-archetypes">Archetypes & tertiary stats</th>
              <th class="col-combine">Combine with</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="8" class="loading">Loading data from Google Sheets...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>

</html>
